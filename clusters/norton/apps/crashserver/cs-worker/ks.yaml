apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cs-worker
  namespace: flux-system
spec:
  interval: 30m
  timeout: 1m
  path: "./clusters/norton/apps/crashserver/cs-worker/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-norton
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2beta1
      kind: HelmRelease
      name: trust-manager
      namespace: critical