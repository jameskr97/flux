apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fusionauth
  namespace: support
spec:
  ingressClassName: external
  rules:
  - host: auth.jameskr.dev
    http:
      paths:
      - backend:
          service:
            name: fusionauth
            port:
              number: 9011
        path: /
        pathType: Prefix
