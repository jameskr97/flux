---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app otfrontend
  namespace: tracking
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.6.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      otfrontend:
        containers:
          main:
            image:
              repository: owntracks/frontend
              tag: main
              pullPolicy: IfNotPresent
            resources:
              requests:
                cpu: 15m
                memory: 105Mi
              limits:
                memory: 105Mi
            env:
              SERVER_HOST: 10.20.0.2
              SERVER_PORT: 8083
    service:
      main:
        type: ClusterIP
        annotations:
        controller: otfrontend
        ports:
          http:
            port: &port 80
    ingress:
      main:
        enabled: true
        className: internal
        annotations:
          external-dns.alpha.kubernetes.io/hostname: owntracks.norton.jameskr.dev
        hosts:
          - host: owntracks.norton.jameskr.dev
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: otfrontend
                  port: *port

    configMaps:
      config:
        enabled: true
        data:
          config.js: |
            window.owntracks.config = {
              api: {
                baseUrl: "https://owntracks.norton.jameskr.dev",
              },
            };
    persistence:
      config:
        enabled: true
        type: configMap
        name: otfrontend-config
        globalMounts:
          - path: /usr/share/nginx/html/config/config.js
            subPath: config.js
