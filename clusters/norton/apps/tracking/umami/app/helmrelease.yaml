---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app umami
  namespace: tracking
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.6.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      umami:
        containers:
          main:
            image:
              repository: docker.umami.is/umami-software/umami
              tag: postgresql-latest
              pullPolicy: IfNotPresent
            env:
              DATABASE_URL: postgres://umami:umami@10.20.0.3:5432/umami
    service:
      main:
        type: ClusterIP
        annotations:
        controller: umami
        ports:
          http:
            port: &port 3000
    ingress:
      main:
        enabled: true
        className: external
        annotations:
          external-dns.alpha.kubernetes.io/hostname: umami.jameskr.dev
        hosts:
          - host: umami.jameskr.dev
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: umami
                  port: *port
