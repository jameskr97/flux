---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mealie
  namespace: personal
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.6.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      mealie:
        containers:
          main:
            image:
              repository: ghcr.io/mealie-recipes/mealie
              tag: v2.5.0
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: mealie-secrets
            env:
              TZ: America/New_York
              PUID: 1000
              PGID: 1000
              BASE_URL: https://mealie.norton.jameskr.dev
              POSTGRES_USER: mealie
              POSTGRES_SERVER: postgres
              POSTGRES_PORT: 5432
              POSTGRES_DB: mealie
              LDAP_AUTH_ENABLED: true
              LDAP_SERVER_URL: ldap://auth.norton.jameskr.dev:3890
              LDAP_BASE_DN: dc=norton,dc=jameskr,dc=dev
              LDAP_USER_FILTER: (memberof=cn=Mealie.User,ou=groups,dc=norton,dc=jameskr,dc=dev)
              LDAP_ADMIN_FILTER: (memberof=cn=Mealie.Admin,ou=groups,dc=norton,dc=jameskr,dc=dev)
              LDAP_ID_ATTRIBUTE: uid
              LDAP_NAME_ATTRIBUTE: display_name
              LDAP_MAIL_ATTRIBUTE: mail
              OIDC_AUTH_ENABLED: true
              OIDC_SIGNUP_ENABLED: false
              OIDC_CONFIGURATION_URL: https://kanidm.jameskr.dev/oauth2/openid/mealie/.well-known/openid-configuration
              OIDC_CLIENT_ID: mealie
              OIDC_PROVIDER_NAME: JPN


    service:
      main:
        type: ClusterIP
        annotations:
        controller: mealie
        ports:
          http:
            port: &port 9000
    ingress:
      main:
        className: internal
        hosts:
          - host: mealie.norton.jameskr.dev
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: mealie
                  port: *port
    persistence:
      config:
        enabled: true
        type: nfs
        server: 10.20.0.3
        path: /srv/k8s/_personal/mealie
        globalMounts:
          - path: /app/data
