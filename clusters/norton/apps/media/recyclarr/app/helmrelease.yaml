---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app recyclarr
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.6.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      recyclarr:
        containers:
          main:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 2.1.2
              pullPolicy: IfNotPresent
            env:
              TZ: America/New_York
    persistence:
      config:
        enabled: true
        type: nfs
        server: 10.20.0.3
        path: /srv/k8s/_media/recyclarr
